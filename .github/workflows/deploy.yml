name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 需要以下仓库 Secrets：
    #   CLOUDFLARE_API_TOKEN  — 具备 "Cloudflare Pages: Edit" 权限的 API Token
    #   CLOUDFLARE_ACCOUNT_ID — Cloudflare 账户 ID
    #   SITE_URL              — 线上域名，如 https://jackyli.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # secret 未配置时为空字符串，astro.config.mjs 会回退到 example.com
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=personal-blog --branch=main
