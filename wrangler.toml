# Cloudflare Pages 配置
# 项目通过 GitHub Actions（.github/workflows/deploy.yml）部署，
# 也可以本地用 `pnpm deploy` 直接上传 dist/（同目录 functions/ 会被一并打包）。
#
# Notes 阅读计数：Pages Functions（functions/api/views*）+ KV binding VIEWS。

name = "personal-blog"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-23"

[[kv_namespaces]]
binding = "VIEWS"
id = "c9374b0e94384a77a3d66f96ee9841e2"
